name: Build YourControls CLI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "19.1.7"

      - name: Show tool versions
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          clang --version

      - name: Create build .env
        shell: pwsh
        run: |
          @"
          SERVER_HOSTNAME=127.0.0.1
          SERVER_PORT=25071
          "@ | Set-Content -Path .env

      - name: Build CLI
        shell: pwsh
        run: |
          cargo build `
            -p yourcontrols `
            --release `
            --no-default-features `
            --bin YourControlsCLI `
            --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null

          Copy-Item `
            target/x86_64-pc-windows-msvc/release/YourControlsCLI.exe `
            out/YourControlsCLI.exe

          if (Test-Path SimConnect.dll) {
            Copy-Item SimConnect.dll out/SimConnect.dll
          }

          if (Test-Path assets) {
            Copy-Item assets out/assets -Recurse
          }

          if (Test-Path definitions) {
            Copy-Item definitions out/definitions -Recurse
          }

          Compress-Archive `
            -Path out/* `
            -DestinationPath YourControlsCLI.zip `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: YourControlsCLI-Windows
          path: YourControlsCLI.zip
          if-no-files-found: error
